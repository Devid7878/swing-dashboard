name: Update news
on:
  schedule:
    - cron: "*/30 2-17 * * *"   # every 30 min, 7:30 AM - 11:00 PM IST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - run: python fetch_news.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add news.json
          git diff --staged --quiet || (git commit -m "Update news" && git pull --rebase && git push)
